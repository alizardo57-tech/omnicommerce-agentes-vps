services:
  - type: web
    name: omnicommerce-agentes-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        value: "2026"
      - key: SUPER_ADMIN_PASS
        value: admin2026
      - key: SETOR_INICIAL
        value: pizzaria
      - key: LLM_PROVIDER
        value: gemini
