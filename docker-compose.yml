services:
  api:
    build: .
    container_name: omnicommerce_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - evolution

  evolution:
    image: atendai/evolution-api:v2.1.1
    container_name: omnicommerce_whatsapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-omnicommerce_secret_key_2026}
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_instances:
