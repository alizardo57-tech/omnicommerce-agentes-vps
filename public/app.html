<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniCommerce SaaS • Login, Painel Super Admin & Módulos por Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen antialiased">

  <!-- TELA DE LOGIN -->
  <section id="telaLogin" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-stone-100 via-stone-50 to-emerald-50/40">
    <div class="w-full max-w-md bg-white border border-stone-200/90 rounded-3xl p-7 shadow-xl shadow-stone-200/60">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-2xl bg-emerald-600 flex items-center justify-center text-white text-xl font-black shadow-sm">
          <i class="fa-solid fa-store"></i>
        </div>
        <div>
          <h1 class="text-lg font-black text-stone-900 tracking-tight">OmniCommerce OS</h1>
          <p class="text-xs text-stone-500">Painel da Loja & Super Admin</p>
        </div>
      </div>

      <form onsubmit="fazerLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">E-mail de Acesso</label>
          <input id="loginEmail" type="email" required placeholder="admin@omnicommerce.com" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 text-sm text-stone-900 focus:outline-none focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/15">
        </div>
        <div>
          <label class="block text-xs font-bold text-stone-600 mb-1">Senha</label>
          <input id="loginSenha" type="password" required placeholder="••••••" class="w-full bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 text-sm text-stone-900 focus:outline-none focus:bg-white focus:border-emerald-600 focus:ring-2 focus:ring-emerald-500/15">
        </div>
        <div id="erroLogin" class="hidden text-xs text-rose-700 font-bold bg-rose-50 border border-rose-200 rounded-xl p-2.5"></div>
        <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-sm transition">
          Entrar no Sistema
        </button>
      </form>

      <div class="mt-5 pt-4 border-t border-stone-200 space-y-2">
        <p class="text-[11px] text-stone-500 font-bold uppercase tracking-wide">Acesso rápido (1 clique):</p>
        <div class="grid grid-cols-1 gap-2 text-xs">
          <button onclick="preencherLogin('bellapizza@loja.com','123456')" class="px-3 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 font-bold text-left hover:bg-rose-100 transition">
            🍕 Bella Pizza (PDV + ERP + Camila) — bellapizza@loja.com
          </button>
          <button onclick="preencherLogin('studiovip@loja.com','123456')" class="px-3 py-2.5 rounded-xl bg-stone-100 border border-stone-200 text-stone-800 font-bold text-left hover:bg-stone-200/70 transition">
            💎 Studio VIP Piercing — studiovip@loja.com
          </button>
          <button onclick="preencherLogin('fornonobre@loja.com','123456')" class="px-3 py-2.5 rounded-xl bg-stone-100 border border-stone-200 text-stone-700 font-bold text-left hover:bg-stone-200/70 transition">
            🔥 Forno Nobre (PDV + ERP) — fornonobre@loja.com
          </button>
          <button onclick="preencherLogin('admin@omnicommerce.com','admin2026')" class="px-3 py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 font-bold text-left hover:bg-amber-100 transition">
            👑 Super Admin Geral — admin@omnicommerce.com
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- PAINEL SUPER ADMIN (GERAL DE CLIENTES) -->
  <section id="telaSuperAdmin" class="hidden max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
    <header class="flex flex-wrap items-center justify-between gap-3 bg-white border border-stone-200 rounded-2xl p-4 shadow-sm">
      <div>
        <span class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800">Super Admin Geral</span>
        <h2 class="text-xl font-black text-stone-900 mt-1">Painel Geral de Clientes & Módulos</h2>
      </div>
      <div class="flex items-center gap-2">
        <span id="badgeHibridoAdmin" class="text-xs font-mono px-3 py-1.5 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 font-bold">Híbrido: ...</span>
        <button onclick="sair()" class="px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold hover:bg-rose-100">Sair</button>
      </div>
    </header>

    <!-- CADASTRAR NOVO CLIENTE -->
    <div class="bg-white border border-stone-200 rounded-2xl p-5 shadow-sm">
      <h3 class="text-sm font-black text-stone-900 mb-3"><i class="fa-solid fa-plus-circle text-emerald-600 mr-2"></i>Cadastrar Nova Loja / Cliente</h3>
      <form onsubmit="cadastrarCliente(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-xs">
        <input id="novoNome" required placeholder="Nome da Loja" class="bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-stone-900">
        <select id="novoSetor" class="bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-stone-900 font-bold"></select>
        <input id="novoEmail" type="email" required placeholder="E-mail Admin da Loja" class="bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-stone-900">
        <input id="novoSenha" required placeholder="Senha Inicial" value="123456" class="bg-stone-50 border border-stone-300 rounded-xl px-3 py-2 text-stone-900">
        <button type="submit" class="rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black py-2 px-4">Criar Cliente</button>
      </form>
    </div>

    <!-- LISTA DE CLIENTES COM CHAVES DE MÓDULOS -->
    <div id="listaClientesAdmin" class="grid grid-cols-1 gap-4"></div>
  </section>

  <!-- PAINEL DO CLIENTE (ADMIN DA LOJA DELE - SÓ VÊ OS MÓDULOS HABILITADOS) -->
  <section id="telaCliente" class="hidden max-w-6xl mx-auto p-4 sm:p-6 space-y-5">
    <header class="flex flex-wrap items-center justify-between gap-3 bg-white border border-stone-200 rounded-2xl p-4 shadow-sm">
      <div>
        <div class="flex items-center gap-2">
          <h2 id="cliNomeLoja" class="text-xl font-black text-stone-900">Minha Loja</h2>
          <span id="cliSetorBadge" class="text-[10px] font-black uppercase px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">setor</span>
        </div>
        <p id="cliUsuarioInfo" class="text-xs text-stone-500 mt-0.5"></p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="recarregarPermissoesCliente()" class="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-bold text-stone-700 border border-stone-200">
          <i class="fa-solid fa-rotate mr-1 text-emerald-600"></i> Atualizar
        </button>
        <button onclick="sair()" class="px-3.5 py-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-bold hover:bg-rose-100">Sair</button>
      </div>
    </header>

    <!-- ABAS LIBERADAS PARA ESTE CLIENTE -->
    <nav id="cliAbasModulos" class="flex flex-wrap gap-2 bg-white p-2 rounded-2xl border border-stone-200 shadow-sm"></nav>

    <!-- CONTEÚDO DO MÓDULO SELECIONADO -->
    <div id="cliConteudoModulo" class="bg-white border border-stone-200 rounded-2xl p-5 sm:p-6 min-h-[340px] shadow-sm"></div>
  </section>

  <script>
    let tokenAtual = localStorage.getItem('omni_saas_token') || '';
    let sessaoAtual = null;
    const NOMES_MODULOS = {
      pdv: { label: 'PDV Caixa', icon: 'fa-cash-register' },
      erp: { label: 'ERP Estoque & Financeiro', icon: 'fa-boxes-stacked' },
      agenda: { label: 'Agenda / Forno / Termos', icon: 'fa-calendar-check' },
      whatsapp_ia: { label: 'WhatsApp IA (Camila)', icon: 'fa-brands fa-whatsapp' },
      agentes11: { label: 'Esquadrão 11 Agentes', icon: 'fa-robot' }
    };

    function preencherLogin(email, senha) {
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginSenha').value = senha;
    }

    async function api(url, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (tokenAtual) headers.Authorization = `Bearer ${tokenAtual}`;
      const resp = await fetch(url, { ...opts, headers });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.erro || 'Erro na requisição');
      return data;
    }

    async function fazerLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('erroLogin');
      errBox.classList.add('hidden');
      try {
        const res = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            senha: document.getElementById('loginSenha').value
          })
        });
        tokenAtual = res.token;
        localStorage.setItem('omni_saas_token', tokenAtual);
        sessaoAtual = res;
        abrirTelaPorPerfil(res);
      } catch (err) {
        errBox.innerText = err.message;
        errBox.classList.remove('hidden');
      }
    }

    function sair() {
      tokenAtual = '';
      sessaoAtual = null;
      localStorage.removeItem('omni_saas_token');
      document.getElementById('telaSuperAdmin').classList.add('hidden');
      document.getElementById('telaCliente').classList.add('hidden');
      document.getElementById('telaLogin').classList.remove('hidden');
    }

    function abrirTelaPorPerfil(dados) {
      document.getElementById('telaLogin').classList.add('hidden');
      if (dados.usuario.role === 'SUPER_ADMIN') {
        document.getElementById('telaCliente').classList.add('hidden');
        document.getElementById('telaSuperAdmin').classList.remove('hidden');
        carregarPainelSuperAdmin();
      } else {
        document.getElementById('telaSuperAdmin').classList.add('hidden');
        document.getElementById('telaCliente').classList.remove('hidden');
        renderizarPainelCliente(dados);
      }
    }

    async function carregarPainelSuperAdmin() {
      const [{ clientes, setores }, hib] = await Promise.all([
        api('/api/superadmin/clientes'),
        api('/api/hibrido/status')
      ]);
      document.getElementById('badgeHibridoAdmin').innerText = `Modo: ${hib.modoAtivo} (${hib.latenciaMs ? hib.latenciaMs + 'ms' : 'Local'})`;

      const sel = document.getElementById('novoSetor');
      sel.innerHTML = setores.map(s => `<option value="${s}">${s.toUpperCase()}</option>`).join('');

      const box = document.getElementById('listaClientesAdmin');
      box.innerHTML = clientes.map(c => `
        <div class="bg-white border border-stone-200 rounded-2xl p-4 shadow-sm flex flex-col gap-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <strong class="text-stone-900 text-base">${c.nome}</strong>
              <span class="ml-2 px-2 py-0.5 rounded-full text-[10px] font-black uppercase bg-sky-100 text-sky-800">${c.setor}</span>
              <span class="ml-2 text-xs text-stone-500 font-mono">${c.emailAdmin}</span>
            </div>
            <label class="flex items-center gap-2 text-xs font-bold cursor-pointer">
              <input type="checkbox" ${c.ativo ? 'checked' : ''} onchange="atualizarCliente('${c.id}', { ativo: this.checked })" class="accent-emerald-600 w-4 h-4">
              <span class="${c.ativo ? 'text-emerald-700' : 'text-rose-600'}">${c.ativo ? 'Conta Ativa' : 'Suspensa'}</span>
            </label>
          </div>
          <div class="flex flex-wrap gap-2">
            ${Object.keys(NOMES_MODULOS).map(m => `
              <label class="flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-bold cursor-pointer ${
                c.modulos[m] ? 'bg-emerald-50 border-emerald-300 text-emerald-800' : 'bg-stone-50 border-stone-200 text-stone-500'
              }">
                <input type="checkbox" ${c.modulos[m] ? 'checked' : ''} onchange="toggleModulo('${c.id}', '${m}', this.checked, ${JSON.stringify(c.modulos).replace(/"/g, '&quot;')})" class="accent-emerald-600">
                <span>${NOMES_MODULOS[m].label}</span>
              </label>
            `).join('')}
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-2 pt-2 border-t border-stone-200">
            <div class="lg:col-span-2 flex gap-2">
              <input id="treino_${c.id}" value="${(c.instrucoesCamila || '').replace(/"/g, '&quot;')}" placeholder="Treinamento da Camila (como este cliente atende)..." class="flex-1 bg-stone-50 border border-stone-300 rounded-xl px-3 py-1.5 text-xs text-stone-900">
              <button onclick="salvarTreinoCamila('${c.id}')" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold">Salvar Treino</button>
            </div>
            <button onclick="adicionarProdutoCliente('${c.id}')" class="px-3 py-1.5 rounded-xl bg-sky-50 border border-sky-200 text-sky-800 text-xs font-bold hover:bg-sky-100">+ Produto</button>
          </div>
          <div class="text-[11px] text-stone-500">
            Link Demo WhatsApp/Insta p/ este cliente: <a href="/demo-chat.html?loja=${c.id}" target="_blank" class="text-emerald-700 underline font-mono font-bold">/demo-chat.html?loja=${c.id}</a>
          </div>
        </div>
      `).join('');
    }

    async function salvarTreinoCamila(clienteId) {
      const texto = document.getElementById(`treino_${clienteId}`).value;
      await atualizarCliente(clienteId, { instrucoesCamila: texto });
      alert('✅ Treinamento da Camila salvo! Já está valendo no chat do cliente.');
    }

    async function adicionarProdutoCliente(clienteId) {
      const nome = prompt('Nome do produto de teste:');
      if (!nome) return;
      const preco = parseFloat(prompt('Preço de venda (R$):', '49.90') || '0');
      await atualizarCliente(clienteId, { novoProduto: { nome, preco, custo: preco * 0.4, estoque: 50 } });
      alert(`✅ Produto "${nome}" adicionado na loja!`);
    }

    async function toggleModulo(clienteId, modKey, valor, modulosAtuais) {
      const novos = { ...modulosAtuais, [modKey]: valor };
      await atualizarCliente(clienteId, { modulos: novos });
    }

    async function atualizarCliente(clienteId, payload) {
      await api(`/api/superadmin/clientes/${clienteId}/modulos`, { method: 'PATCH', body: JSON.stringify(payload) });
      carregarPainelSuperAdmin();
    }

    async function cadastrarCliente(e) {
      e.preventDefault();
      await api('/api/superadmin/clientes', {
        method: 'POST',
        body: JSON.stringify({
          nome: document.getElementById('novoNome').value,
          setor: document.getElementById('novoSetor').value,
          emailAdmin: document.getElementById('novoEmail').value,
          senhaAdmin: document.getElementById('novoSenha').value,
          modulos: { pdv: true, erp: true, agenda: false, whatsapp_ia: false, agentes11: false }
        })
      });
      e.target.reset();
      carregarPainelSuperAdmin();
    }

    function renderizarPainelCliente(dados) {
      const t = dados.tenant;
      document.getElementById('cliNomeLoja').innerText = t.nome;
      document.getElementById('cliSetorBadge').innerText = t.setor;
      document.getElementById('cliUsuarioInfo').innerText = `Logado como: ${dados.usuario.nome} (${dados.usuario.email}) • Apenas módulos contratados visíveis`;

      const habilitados = Object.keys(NOMES_MODULOS).filter(m => t.modulos[m]);
      const nav = document.getElementById('cliAbasModulos');
      nav.innerHTML = habilitados.map((m, idx) => `
        <button data-mod="${m}" onclick="abrirModuloCliente('${m}')" class="px-4 py-2 rounded-xl text-xs font-bold transition ${
          idx === 0 ? 'bg-emerald-600 text-white shadow-sm' : 'text-stone-600 hover:bg-stone-100'
        }">
          <i class="fa-solid ${NOMES_MODULOS[m].icon} mr-1.5"></i> ${NOMES_MODULOS[m].label}
        </button>
      `).join('');

      if (habilitados.length > 0) abrirModuloCliente(habilitados[0]);
      else document.getElementById('cliConteudoModulo').innerHTML = '<p class="text-sm text-rose-600">Nenhum módulo habilitado para esta loja.</p>';
    }

    function abrirModuloCliente(modKey) {
      document.querySelectorAll('#cliAbasModulos button[data-mod]').forEach(btn => {
        const ativo = btn.dataset.mod === modKey;
        btn.className = `px-4 py-2 rounded-xl text-xs font-bold transition ${ativo ? 'bg-emerald-600 text-white shadow-sm' : 'text-stone-600 hover:bg-stone-100'}`;
      });
      const t = sessaoAtual.tenant;
      const produtos = sessaoAtual.produtosSetor || [];
      const box = document.getElementById('cliConteudoModulo');
      if (modKey === 'pdv' && typeof renderPdvCliente === 'function') {
        renderPdvCliente(box, t, produtos);
      } else if (modKey === 'erp' && typeof renderErpCliente === 'function') {
        renderErpCliente(box, t, produtos);
      } else if (modKey === 'whatsapp_ia') {
        box.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
            <div>
              <h3 class="text-lg font-black text-emerald-700">Camila IA • WhatsApp & Instagram Direct (${t.nome})</h3>
              <p class="text-xs text-stone-500">Treinamento ativo: <em>${t.instrucoesCamila || 'Padrão do setor'}</em></p>
            </div>
            <a href="/demo-chat.html?loja=${t.id}" target="_blank" class="px-3.5 py-2 rounded-xl bg-pink-50 border border-pink-200 text-pink-700 text-xs font-bold hover:bg-pink-100 transition">Abrir Link Demo Celular (WhatsApp/Insta)</a>
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div>
              <div id="chatCamilaMsgs" class="bg-stone-50 border border-stone-200 rounded-2xl p-4 h-64 overflow-y-auto space-y-2 text-xs mb-3">
                <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-stone-800 max-w-[85%]">Olá! Sou a <strong class="text-emerald-800">Camila</strong> da <strong>${t.nome}</strong>. Teste aqui ou pelo link do celular!</div>
              </div>
              <form onsubmit="enviarChatCamila(event)" class="flex gap-2">
                <input id="inputChatCamila" required placeholder="Simule mensagem do cliente..." class="flex-1 bg-stone-50 border border-stone-300 rounded-xl px-3.5 py-2.5 text-xs text-stone-900 focus:outline-none focus:bg-white focus:border-emerald-600">
                <button type="submit" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-black shadow-sm">Enviar</button>
              </form>
            </div>
            <div>
              <div class="text-xs font-black text-stone-800 mb-2">📡 Tela ao Vivo: Conversas Recebidas (WhatsApp & Instagram)</div>
              <div id="feedConversasCamila" class="bg-stone-50 border border-stone-200 rounded-2xl p-3 h-72 overflow-y-auto space-y-2"></div>
            </div>
          </div>`;
        if (typeof atualizarFeedConversas === 'function') atualizarFeedConversas();
      } else {
        box.innerHTML = `<h3 class="text-lg font-black text-emerald-700 mb-2">${NOMES_MODULOS[modKey].label}</h3><p class="text-sm text-stone-600">Módulo habilitado pelo Administrador Geral para <strong>${t.nome}</strong>.</p>`;
      }
    }

    async function recarregarPermissoesCliente() {
      const res = await api('/api/auth/me');
      sessaoAtual = res;
      renderizarPainelCliente(res);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!tokenAtual) return;
      try {
        const res = await api('/api/auth/me');
        sessaoAtual = res;
        abrirTelaPorPerfil(res);
      } catch { sair(); }
    });
  </script>
  <script src="/js/app-feed.js"></script>
  <script src="/js/app-pdv.js"></script>
</body>
</html>
