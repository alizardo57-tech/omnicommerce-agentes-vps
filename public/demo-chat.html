<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Teste Ao Vivo • Camila IA (WhatsApp & Instagram)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-2 sm:p-4">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col h-[90vh] max-h-[720px]">
    <!-- HEADER -->
    <div id="chatHeader" class="bg-emerald-700 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-white font-black">
          <i id="iconeCanal" class="fa-brands fa-whatsapp text-xl"></i>
        </div>
        <div>
          <h1 id="nomeLojaChat" class="text-sm font-black text-white">Carregando loja...</h1>
          <p class="text-[11px] text-white/80"><span class="inline-block w-2 h-2 rounded-full bg-emerald-300 mr-1"></span>Camila IA • Online agora</p>
        </div>
      </div>
      <div class="flex gap-1 bg-black/25 p-1 rounded-xl text-[11px] font-bold">
        <button onclick="trocarCanal('WhatsApp')" id="btnWhats" class="px-2.5 py-1 rounded-lg bg-white text-emerald-800">WhatsApp</button>
        <button onclick="trocarCanal('Instagram')" id="btnInsta" class="px-2.5 py-1 rounded-lg text-white/80">Instagram</button>
      </div>
    </div>

    <!-- MENSAGENS -->
    <div id="boxMsgs" class="flex-1 p-4 overflow-y-auto space-y-2.5 text-xs bg-slate-950">
      <div class="p-3 rounded-2xl rounded-tl-sm bg-slate-800 text-slate-200 max-w-[85%]">
        Olá! Sou a <strong>Camila</strong>. Me mande uma mensagem como se fosse um cliente no WhatsApp ou Direct do Instagram!
      </div>
    </div>

    <!-- INPUT -->
    <form onsubmit="enviarMsg(event)" class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
      <input id="inputMsg" required placeholder="Digite sua mensagem de teste..." class="flex-1 bg-slate-950 border border-slate-700 rounded-full px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
      <button type="submit" id="btnEnviar" class="w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center flex-shrink-0">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lojaId = params.get('loja') || 'cli_fornonobre';
    let canalAtual = 'WhatsApp';
    let jaEnviouLink = false;
    const historico = [];

    function trocarCanal(canal) {
      canalAtual = canal;
      const header = document.getElementById('chatHeader');
      const icone = document.getElementById('iconeCanal');
      const btnW = document.getElementById('btnWhats');
      const btnI = document.getElementById('btnInsta');
      const btnE = document.getElementById('btnEnviar');

      if (canal === 'Instagram') {
        header.className = 'bg-gradient-to-r from-pink-600 via-purple-600 to-indigo-600 px-4 py-3 flex items-center justify-between';
        icone.className = 'fa-brands fa-instagram text-xl';
        btnI.className = 'px-2.5 py-1 rounded-lg bg-white text-pink-700';
        btnW.className = 'px-2.5 py-1 rounded-lg text-white/80';
        btnE.className = 'w-10 h-10 rounded-full bg-pink-600 hover:bg-pink-500 text-white flex items-center justify-center flex-shrink-0';
      } else {
        header.className = 'bg-emerald-700 px-4 py-3 flex items-center justify-between';
        icone.className = 'fa-brands fa-whatsapp text-xl';
        btnW.className = 'px-2.5 py-1 rounded-lg bg-white text-emerald-800';
        btnI.className = 'px-2.5 py-1 rounded-lg text-white/80';
        btnE.className = 'w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center flex-shrink-0';
      }
    }

    async function carregarLoja() {
      try {
        const resp = await fetch(`/api/demo/loja/${lojaId}`);
        const d = await resp.json();
        document.getElementById('nomeLojaChat').innerText = d.nome || 'Loja Demo';
      } catch {
        document.getElementById('nomeLojaChat').innerText = 'Loja Demo';
      }
    }

    async function enviarMsg(e) {
      e.preventDefault();
      const input = document.getElementById('inputMsg');
      const texto = input.value.trim();
      if (!texto) return;
      const box = document.getElementById('boxMsgs');
      box.innerHTML += `<div class="p-3 rounded-2xl rounded-tr-sm bg-emerald-700 text-white max-w-[80%] ml-auto">${texto}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        const resp = await fetch(`/api/demo/chat/${lojaId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: texto, canal: canalAtual, jaEnviouLink, historico: historico.slice(-6) })
        });
        const data = await resp.json();
        if (String(data.resposta || '').includes('/loja.html')) {
          jaEnviouLink = true;
        }
        if (data.resposta) {
          historico.push({ quem: 'cliente', texto });
          historico.push({ quem: 'camila', texto: data.resposta });
        }
        const tag = canalAtual === 'Instagram' ? 'Instagram Direct' : 'WhatsApp';
        const respHtml = String(data.resposta || data.erro).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="underline text-emerald-300 font-bold">$1</a>');
        box.innerHTML += `<div class="p-3 rounded-2xl rounded-tl-sm bg-slate-800 text-slate-200 max-w-[85%] whitespace-pre-line"><span class="text-[10px] text-emerald-400 font-bold block mb-0.5">Camila (${tag})</span>${respHtml}</div>`;
      } catch {
        box.innerHTML += `<div class="p-2 text-rose-400">Erro de conexão. Tente novamente.</div>`;
      }
      box.scrollTop = box.scrollHeight;
    }

    carregarLoja();
    const itemSelecionado = params.get('item');
    if (itemSelecionado) {
      document.getElementById('inputMsg').value = `Oi! Vi na vitrine e tenho interesse em: ${itemSelecionado}`;
    }
  </script>
</body>
</html>
