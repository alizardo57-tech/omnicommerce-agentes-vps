<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Atendimento • WhatsApp & Instagram</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-200 text-stone-800 min-h-screen flex items-center justify-center p-0 sm:p-4">

  <div class="w-full max-w-md bg-white sm:border sm:border-stone-300 sm:rounded-3xl overflow-hidden shadow-xl flex flex-col h-screen sm:h-[90vh] sm:max-h-[720px]">
    <!-- HEADER -->
    <div id="chatHeader" class="bg-[#075E54] px-4 py-3 flex items-center justify-between text-white">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center font-bold">
          <i id="iconeCanal" class="fa-brands fa-whatsapp text-xl"></i>
        </div>
        <div>
          <h1 id="nomeLojaChat" class="text-sm font-bold leading-tight">Carregando...</h1>
          <p class="text-[11px] text-white/85"><span class="inline-block w-2 h-2 rounded-full bg-emerald-300 mr-1"></span>Camila • Online agora</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="flex gap-1 bg-black/20 p-1 rounded-xl text-[11px] font-semibold">
          <button onclick="trocarCanal('WhatsApp')" id="btnWhats" class="px-2.5 py-1 rounded-lg bg-white text-[#075E54]">WhatsApp</button>
          <button onclick="trocarCanal('Instagram')" id="btnInsta" class="px-2.5 py-1 rounded-lg text-white/90">Instagram</button>
        </div>
        <button onclick="limparChat()" title="Nova conversa" class="w-7 h-7 rounded-lg bg-black/20 hover:bg-black/35 text-white flex items-center justify-center text-[11px]">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </div>

    <!-- MENSAGENS -->
    <div id="boxMsgs" class="flex-1 p-4 overflow-y-auto space-y-2.5 text-[13px] bg-[#EFEAE2]">
      <div class="p-3 rounded-2xl rounded-tl-sm bg-white text-stone-800 shadow-sm max-w-[85%]">
        Olá! Sou a <strong>Camila</strong>. Como posso te ajudar hoje?
      </div>
    </div>

    <!-- INPUT -->
    <form onsubmit="enviarMsg(event)" class="p-2.5 bg-[#F0F2F5] border-t border-stone-200 flex gap-2">
      <input id="inputMsg" required placeholder="Digite sua mensagem..." class="flex-1 bg-white border border-stone-300 rounded-full px-4 py-2.5 text-[13px] text-stone-800 focus:outline-none focus:border-emerald-600">
      <button type="submit" id="btnEnviar" class="w-10 h-10 rounded-full bg-[#008069] hover:bg-[#016a57] text-white flex items-center justify-center flex-shrink-0 shadow-sm">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lojaId = params.get('loja') || 'cli_studiovip';
    const storageKey = `omni_demo_chat_${lojaId}`;
    let canalAtual = 'WhatsApp';
    let jaEnviouLink = false;
    let historico = [];

    function salvarSessao() {
      localStorage.setItem(storageKey, JSON.stringify({ historico: historico.slice(-20), jaEnviouLink, canalAtual }));
    }

    function formatarLinks(txt) {
      return String(txt || '').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" class="underline text-emerald-700 font-semibold">$1</a>');
    }

    function renderizarMsg(quem, texto, canalTag) {
      const box = document.getElementById('boxMsgs');
      if (quem === 'cliente') {
        box.innerHTML += `<div class="p-2.5 px-3.5 rounded-2xl rounded-tr-sm bg-[#D9FDD3] text-stone-900 shadow-sm max-w-[80%] ml-auto whitespace-pre-line">${texto}</div>`;
      } else {
        const tag = canalTag === 'Instagram' ? 'Instagram Direct' : 'WhatsApp';
        box.innerHTML += `<div class="p-2.5 px-3.5 rounded-2xl rounded-tl-sm bg-white text-stone-800 shadow-sm max-w-[85%] whitespace-pre-line"><span class="text-[10px] text-emerald-700 font-semibold block mb-0.5">Camila • ${tag}</span>${formatarLinks(texto)}</div>`;
      }
    }

    function restaurarSessao() {
      try {
        const salvo = JSON.parse(localStorage.getItem(storageKey) || 'null');
        if (salvo && Array.isArray(salvo.historico) && salvo.historico.length) {
          historico = salvo.historico;
          jaEnviouLink = Boolean(salvo.jaEnviouLink);
          if (salvo.canalAtual) trocarCanal(salvo.canalAtual);
          historico.forEach(m => renderizarMsg(m.quem, m.texto, m.canal || canalAtual));
          const box = document.getElementById('boxMsgs');
          box.scrollTop = box.scrollHeight;
        }
      } catch {}
    }

    function limparChat() {
      localStorage.removeItem(storageKey);
      historico = [];
      jaEnviouLink = false;
      document.getElementById('boxMsgs').innerHTML = `<div class="p-3 rounded-2xl rounded-tl-sm bg-white text-stone-800 shadow-sm max-w-[85%]">Olá! Sou a <strong>Camila</strong>. Como posso te ajudar hoje?</div>`;
    }

    function trocarCanal(canal) {
      canalAtual = canal;
      const header = document.getElementById('chatHeader');
      const icone = document.getElementById('iconeCanal');
      const btnW = document.getElementById('btnWhats');
      const btnI = document.getElementById('btnInsta');
      const btnE = document.getElementById('btnEnviar');
      if (canal === 'Instagram') {
        header.className = 'bg-gradient-to-r from-purple-700 to-pink-600 px-4 py-3 flex items-center justify-between text-white';
        icone.className = 'fa-brands fa-instagram text-xl';
        btnI.className = 'px-2.5 py-1 rounded-lg bg-white text-pink-700';
        btnW.className = 'px-2.5 py-1 rounded-lg text-white/90';
        btnE.className = 'w-10 h-10 rounded-full bg-pink-600 hover:bg-pink-700 text-white flex items-center justify-center flex-shrink-0 shadow-sm';
      } else {
        header.className = 'bg-[#075E54] px-4 py-3 flex items-center justify-between text-white';
        icone.className = 'fa-brands fa-whatsapp text-xl';
        btnW.className = 'px-2.5 py-1 rounded-lg bg-white text-[#075E54]';
        btnI.className = 'px-2.5 py-1 rounded-lg text-white/90';
        btnE.className = 'w-10 h-10 rounded-full bg-[#008069] hover:bg-[#016a57] text-white flex items-center justify-center flex-shrink-0 shadow-sm';
      }
    }

    async function carregarLoja() {
      try {
        const resp = await fetch(`/api/demo/loja/${lojaId}`);
        const d = await resp.json();
        document.getElementById('nomeLojaChat').innerText = d.nome || 'Atendimento Online';
      } catch {
        document.getElementById('nomeLojaChat').innerText = 'Atendimento Online';
      }
    }

    async function enviarMsg(e) {
      e.preventDefault();
      const input = document.getElementById('inputMsg');
      const texto = input.value.trim();
      if (!texto) return;
      const box = document.getElementById('boxMsgs');
      renderizarMsg('cliente', texto, canalAtual);
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        const resp = await fetch(`/api/demo/chat/${lojaId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: texto, canal: canalAtual, jaEnviouLink, historico: historico.slice(-6) })
        });
        const data = await resp.json();
        if (String(data.resposta || '').includes('/loja.html')) {
          jaEnviouLink = true;
        }
        if (data.resposta) {
          historico.push({ quem: 'cliente', texto, canal: canalAtual });
          historico.push({ quem: 'camila', texto: data.resposta, canal: canalAtual });
          salvarSessao();
        }
        renderizarMsg('camila', data.resposta || data.erro, canalAtual);
      } catch {
        box.innerHTML += `<div class="p-2 text-rose-600">Erro de conexão. Tente novamente.</div>`;
      }
      box.scrollTop = box.scrollHeight;
    }

    carregarLoja();
    restaurarSessao();
    const itemSelecionado = params.get('item');
    const pedidoParam = params.get('pedido');
    if (pedidoParam) {
      carregarOrdemPedido(pedidoParam);
      window.history.replaceState({}, '', `/demo-chat.html?loja=${lojaId}`);
    } else if (itemSelecionado) {
      const direto = itemSelecionado.startsWith('Acabei de pagar') || itemSelecionado.startsWith('Fiz o pedido');
      document.getElementById('inputMsg').value = direto ? itemSelecionado : `Oi! Vi na vitrine e tenho interesse em: ${itemSelecionado}`;
    }

    async function carregarOrdemPedido(pedId) {
      try {
        const resp = await fetch(`/api/demo/pedido/${encodeURIComponent(pedId)}`);
        const d = await resp.json();
        if (!d.ok || !d.pedido) return;
        const p = d.pedido;
        const itensHtml = (p.itens || []).map(i => `• ${i.qtd}x ${i.nome} (R$ ${(i.preco * i.qtd).toFixed(2).replace('.', ',')})`).join('<br>');
        const cardOs = `📋 <strong>ORDEM DE PEDIDO ${p.id}</strong>\nCliente: ${p.clienteNome} (${p.clienteWhatsapp})\nTipo: ${p.modalidade === 'entrega' ? '🚚 Entrega' : '🏪 Retirada na loja'}\nEndereço: ${p.endereco}\nPagamento: ${String(p.formaPagamento).toUpperCase()}${p.trocoPara ? ` • Troco: ${p.trocoPara}` : ''}\nTotal: R$ ${Number(p.total).toFixed(2).replace('.', ',')} • Status: ${p.status}\n\nItens:\n${itensHtml.replace(/<br>/g, '\n')}\n\n🖨️ Cupom (2 vias): ${window.location.origin}/cupom.html?pedido=${p.id}`;
        renderizarMsg('cliente', cardOs, canalAtual);
        const resChat = await fetch(`/api/demo/chat/${lojaId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: `Acabei de finalizar o pedido ${p.id}`, canal: canalAtual, jaEnviouLink, historico: historico.slice(-6) })
        });
        const chatData = await resChat.json();
        if (chatData.resposta) {
          historico.push({ quem: 'cliente', texto: cardOs, canal: canalAtual });
          historico.push({ quem: 'camila', texto: chatData.resposta, canal: canalAtual });
          salvarSessao();
          renderizarMsg('camila', chatData.resposta, canalAtual);
          document.getElementById('boxMsgs').scrollTop = document.getElementById('boxMsgs').scrollHeight;
        }
      } catch {}
    }
  </script>
</body>
</html>
