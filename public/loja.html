<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine Online • Catálogo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased pb-16">
  <header class="sticky top-0 z-40 bg-slate-900/95 border-b border-slate-800 backdrop-blur-md px-4 py-3">
    <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 id="vitrineNome" class="text-lg font-black text-white">Carregando Vitrine...</h1>
        <p id="vitrineSub" class="text-xs text-emerald-400 font-bold uppercase tracking-wider"></p>
      </div>
      <div class="flex items-center gap-2">
        <input id="buscaVitrine" oninput="filtrarVitrine()" placeholder="Buscar peça ou produto..." class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        <a id="btnVoltarChat" href="/demo-chat.html" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black flex items-center gap-1.5">
          <i class="fa-brands fa-whatsapp"></i> Falar com Camila
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 pt-6">
    <div id="gridVitrine" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const lojaId = params.get('loja') || 'cli_studiovip';
    let produtosVitrine = [];

    document.getElementById('btnVoltarChat').href = `/demo-chat.html?loja=${lojaId}`;

    async function carregarVitrine() {
      const resp = await fetch(`/api/demo/loja/${lojaId}`);
      const d = await resp.json();
      document.getElementById('vitrineNome').innerText = d.nome || 'Vitrine Online';
      document.getElementById('vitrineSub').innerText = `${d.setor || 'loja'} • Catálogo Online`;
      produtosVitrine = d.produtos || [];
      renderVitrine(produtosVitrine);
    }

    function filtrarVitrine() {
      const q = document.getElementById('buscaVitrine').value.trim().toLowerCase();
      renderVitrine(!q ? produtosVitrine : produtosVitrine.filter(p => p.nome.toLowerCase().includes(q)));
    }

    function renderVitrine(lista) {
      const box = document.getElementById('gridVitrine');
      box.innerHTML = lista.map(p => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between hover:border-emerald-500/40 transition">
          <div>
            <div class="text-3xl mb-2">✨</div>
            <h2 class="text-sm font-black text-white">${p.nome}</h2>
            <p class="text-xs text-slate-400 mt-1">Disponível (${p.estoque} un)</p>
          </div>
          <div class="mt-4 pt-3 border-t border-slate-800 flex items-center justify-between">
            <span class="text-lg font-black text-emerald-400 font-mono">R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</span>
            <a href="/demo-chat.html?loja=${lojaId}&item=${encodeURIComponent(p.nome)}" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">
              Quero este
            </a>
          </div>
        </div>
      `).join('');
    }

    carregarVitrine();
  </script>
</body>
</html>
