<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Online • Catálogo Oficial</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen antialiased pb-24">
  <header class="sticky top-0 z-40 bg-white/95 border-b border-stone-200 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-stone-900 text-white flex items-center justify-center font-bold text-lg shadow-sm">
          <i class="fa-solid fa-gem"></i>
        </div>
        <div>
          <h1 id="vitrineNome" class="text-base sm:text-lg font-bold tracking-tight text-stone-900">Carregando loja...</h1>
          <p id="vitrineSub" class="text-xs text-stone-500 font-medium">Catálogo oficial</p>
        </div>
      </div>
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="relative flex-1 sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-xs"></i>
          <input id="buscaVitrine" oninput="filtrarVitrine()" placeholder="Buscar peça ou serviço..." class="w-full bg-stone-100 border border-stone-200 rounded-xl pl-8 pr-3 py-2 text-xs text-stone-800 focus:outline-none focus:bg-white focus:border-stone-400">
        </div>
        <button onclick="abrirCarrinho()" class="relative px-3.5 py-2 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="hidden sm:inline">Sacola</span>
          <span id="badgeSacola" class="px-1.5 py-0.5 rounded-full bg-emerald-500 text-white text-[10px] font-bold">0</span>
        </button>
        <a id="btnVoltarChat" href="/demo-chat.html" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-sm">
          <i class="fa-brands fa-whatsapp text-sm"></i>
          <span class="hidden sm:inline">Atendente</span>
        </a>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-6">
    <div id="gridVitrine" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- MODAL SACOLA & CHECKOUT -->
  <div id="modalCheckout" class="hidden fixed inset-0 z-50 bg-stone-950/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl shadow-2xl border border-stone-200 max-h-[92vh] flex flex-col overflow-hidden">
      <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
        <h2 class="text-base font-bold text-stone-900">Finalizar Pedido</h2>
        <button onclick="fecharCarrinho()" class="w-8 h-8 rounded-full bg-stone-100 hover:bg-stone-200 text-stone-600 flex items-center justify-center text-sm">&times;</button>
      </div>
      <div id="conteudoCheckout" class="p-5 overflow-y-auto space-y-4 text-sm"></div>
    </div>
  </div>

  <script src="/js/loja.js"></script>
</body>
</html>
